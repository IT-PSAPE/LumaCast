appId: com.lumacast.soundboard
productName: LumaSoundboard

publish:
  provider: generic
  url: https://github.com/IT-PSAPE/LumaCast/releases/download/soundboard-feed
  updaterCacheDirName: lumasoundboard-updater
npmRebuild: false
directories:
  output: dist
files:
  - out/**/*
win:
  target: nsis
  artifactName: "${productName}-${version}-${arch}-win.${ext}"
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  category: public.app-category.music
  target: dmg
linux:
  executableName: lumasoundboard
  category: AudioVideo
  target: AppImage
