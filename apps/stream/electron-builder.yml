appId: com.lumacast.stream
productName: LumaStream
npmRebuild: false
directories:
  output: dist
files:
  - out/**/*
# Licensing notices ship on every platform; the media engine and audio helper
# are platform specific and are listed under `win:` and `mac:` below.
extraResources:
  - from: vendor/ffmpeg/provenance.json
    to: third-party/ffmpeg/provenance.json
  - from: third-party/ffmpeg/NOTICE.md
    to: third-party/ffmpeg/NOTICE.md
  - from: third-party/ffmpeg/COPYING.LGPLv3
    to: third-party/ffmpeg/COPYING.LGPLv3
  - from: third-party/noise-suppression
    to: third-party/noise-suppression
    filter:
      - '*'
win:
  target: nsis
  artifactName: "${productName}-${version}-${arch}-win.${ext}"
  extraResources:
    - from: vendor/ffmpeg/bin
      to: media-engine
      filter:
        - ffmpeg.exe
        - '*.dll'
    - from: native/audio-loopback/publish/AudioLoopback.exe
      to: application-audio/AudioLoopback.exe
    - from: native/zoom/stage/windows
      to: zoom-sdk
    - from: native/zoom/stage/third-party
      to: third-party/zoom
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  category: public.app-category.video
  target:
    - dmg
    - zip
  artifactName: "${productName}-${version}-${arch}-mac.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Usage strings macOS shows when Stream first asks for each capture permission.
  extendInfo:
    NSCameraUsageDescription: LumaStream uses the camera for Video Capture Device sources.
    NSMicrophoneUsageDescription: LumaStream uses the microphone for Audio Input Capture sources.
    NSAudioCaptureUsageDescription: LumaStream records application and system audio for Audio Output Capture and Application Audio Capture sources.
    NSScreenCaptureUsageDescription: LumaStream records displays and windows for Display Capture and Window Capture sources.
  # Signed alongside the app so Gatekeeper accepts the helper binaries in Resources.
  binaries:
    - Contents/Resources/media-engine/ffmpeg
    - Contents/Resources/application-audio/lumastream-audio-tap
    - Contents/Resources/zoom-sdk/lumastream-zoom-sdk.node
    - Contents/Resources/zoom-sdk/ZoomSDK.framework/Versions/A/ZoomSDK
    - Contents/Resources/zoom-sdk/protobuf.framework/Versions/A/protobuf
  extraResources:
    - from: vendor/ffmpeg/bin
      to: media-engine
      filter:
        - ffmpeg
    - from: native/audio-tap/build/lumastream-audio-tap
      to: application-audio/lumastream-audio-tap
    - from: native/zoom/stage/macos
      to: zoom-sdk
    - from: native/zoom/stage/third-party
      to: third-party/zoom
dmg:
  artifactName: "${productName}-${version}-${arch}-mac.${ext}"
