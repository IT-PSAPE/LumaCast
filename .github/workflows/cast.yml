name: Cast

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Per-app group: Cast runs never overlap each other, so a release and its
# packaging fan-out cannot interleave. Pull request runs are cancelled freely
# because they publish nothing.
concurrency:
  group: app-cast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-release:
    name: Cast CI and release
    uses: ./.github/workflows/ci-release.yml
    with:
      app: cast
    permissions:
      contents: write
    secrets: inherit
